# ---------------------------------------------------------------------------
#  Sicherheits-Header
#
#  Wichtig: In nginx ersetzt ein "add_header" in einem location-Block ALLE
#  auf Server-Ebene gesetzten Header. Diese Datei wird deshalb bewusst in
#  jedem location-Block eingebunden, der eigene Header setzt.
#
#  HSTS steht absichtlich nicht hier: TLS endet bei Cloudflare bzw. im
#  Nginx Proxy Manager — dort gehört der Header hin.
# ---------------------------------------------------------------------------
add_header X-Content-Type-Options "nosniff"                          always;
add_header X-Frame-Options        "SAMEORIGIN"                       always;
add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

# Alle Ressourcen (Skripte, Schriften, Bilder) kommen vom eigenen Server.
# Einzige Ausnahme ist connect-src: Der Abschnitt „GitHub" holt seine Zahlen
# live aus der öffentlichen GitHub-API, direkt aus dem Browser der Besucher.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self' https://api.github.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;
