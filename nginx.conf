server {
    # Bewusst nur IPv4: In Docker ist IPv6 in Containern standardmäßig
    # deaktiviert — ein "listen [::]:80" lässt nginx dort beim Start
    # abstürzen. Der Nginx Proxy Manager verbindet sich ohnehin über IPv4;
    # IPv6 von außen terminiert bereits bei Cloudflare bzw. im NPM.
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Serverversion nicht preisgeben
    server_tokens off;

    # ---------------------------------------------------------------
    #  Kompression
    # ---------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    include /etc/nginx/snippets/security-headers.conf;

    # ---------------------------------------------------------------
    #  Health-Endpunkt für Docker und Uptime-Überwachung
    # ---------------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------
    #  Caching
    #
    #  Vite versieht Assets mit einem Inhalts-Hash im Dateinamen —
    #  sie dürfen darum unbegrenzt zwischengespeichert werden.
    # ---------------------------------------------------------------
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2|woff|ttf|otf)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* \.(?:svg|png|jpg|jpeg|webp|avif|ico|gif)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # HTML-Dokumente niemals zwischenspeichern, damit ein Deployment sofort
    # bei allen Besuchern ankommt. Betrifft Startseite, Datenschutzseite und
    # die Fehlerseite gleichermassen.
    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---------------------------------------------------------------
    #  Seitenauslieferung
    #
    #  Die Seiten werden beim Bauen als fertige HTML-Dateien erzeugt
    #  (/index.html und /datenschutz/index.html). Unbekannte Adressen
    #  landen deshalb bewusst NICHT auf der Startseite, sondern liefern
    #  einen echten 404 mit eigener Fehlerseite — sonst wuerde jede
    #  Falschschreibung als gueltige Seite gelten und im Suchindex
    #  Dubletten erzeugen.
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # Versteckte Dateien nicht ausliefern
    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
}
