<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="surface" x1="8" y1="4" x2="56" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101725"/>
      <stop offset="0.55" stop-color="#080b12"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="edge" x1="8" y1="5" x2="55" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b455d"/>
      <stop offset="0.55" stop-color="#1c2333"/>
      <stop offset="1" stop-color="#30384c"/>
    </linearGradient>
    <linearGradient id="orbit" x1="13" y1="12" x2="53" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4ff"/>
      <stop offset="0.52" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14" fill="url(#surface)" stroke="url(#edge)" stroke-width="1.5"/>

  <!-- Reduzierte Umlaufbahn mit bewusst gesetzter Öffnung. -->
  <path
    d="M 47.223 15.094 A 22.75 22.75 0 1 0 53.637 39.030"
    fill="none"
    stroke="url(#orbit)"
    stroke-width="1.8"
    stroke-linecap="round"
  />

  <text
    x="31.7"
    y="31.25"
    fill="#f1f5fb"
    font-family="Inter, 'Segoe UI Variable Display', 'Segoe UI', sans-serif"
    font-size="20.5"
    font-weight="600"
    letter-spacing="-0.9"
    text-anchor="middle"
    dominant-baseline="central"
  >JS</text>

  <!-- Kompakter Pulse Node: feine Signalringe mit hellem Kern. -->
  <circle cx="47.223" cy="15.094" r="3.15" fill="#2dd4ff" opacity="0.1"/>
  <circle cx="47.223" cy="15.094" r="2.35" fill="#07101a" stroke="#67e8f9" stroke-width="0.7" opacity="0.95"/>
  <circle cx="47.223" cy="15.094" r="1.15" fill="#b9f5ff"/>
  <circle cx="46.86" cy="14.72" r="0.38" fill="#ffffff" opacity="0.9"/>
</svg>
